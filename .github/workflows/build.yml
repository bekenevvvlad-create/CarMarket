
name: Build CarMarket Fixed v4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Fixed v4 ZIP
        run: |
          ZIP_PATH=$(find . -type f -name "CarMarket-Android-Project-Fixed-v4.zip" -print -quit)

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: Fixed v4 ZIP not found!"
            find . -type f -name "*.zip"
            exit 1
          fi

          echo "Found: $ZIP_PATH"
          echo "PROJECT_ZIP=$ZIP_PATH" >> $GITHUB_ENV

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "$PROJECT_ZIP" -d project

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "App Gradle file not found!"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug
          else
            gradle clean assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMarket-Fixed-v4-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
