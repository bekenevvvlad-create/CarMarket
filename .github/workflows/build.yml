name: Build CarMarket APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip -o CarMarket-Android-Project.zip -d project

      - name: Build APK
        run: gradle -p project/CarMarketAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMarket-debug-apk
          path: project/CarMarketAndroid/app/build/outputs/apk/debug/app-debug.apk
