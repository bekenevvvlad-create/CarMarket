name: Build CarMarket APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'CarMarket-Android-Project-Fixed-v3.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o CarMarket-Android-Project-Fixed-v3.zip -d project

      - name: Build APK
        working-directory: project/CarMarketAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMarket-debug-apk
          path: project/CarMarketAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
