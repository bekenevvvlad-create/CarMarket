name: Build CarMarket APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract updated project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o CarMarket-Android-Project-Updated.zip -d project

      - name: Check project structure
        run: |
          echo "Contents of project:"
          find project -maxdepth 3 -type f | sort | head -100

      - name: Build APK
        run: |
          gradle -p project/CarMarketAndroid assembleDebug --stacktrace

      - name: Check APK
        run: |
          ls
