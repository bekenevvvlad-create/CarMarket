
name: "Build CarMarket APK"

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CarMarket
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android SDK
        run: |
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null \
              | sort -V | tail -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            ls -R "$SDK_ROOT" || true
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' \
            | grep -i 'photoreal' | head -n 1 || true)

          if [ -z "$ARCHIVE" ]; then
            ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' \
              | grep -i 'Android.*Project' | head -n 1 || true)
          fi

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: Android project ZIP not found in repository root"
            echo "ZIP files found:"
            find . -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi

          echo "Using archive: $ARCHIVE"
          mkdir -p extracted
          unzip -oq "$ARCHIVE" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found in archive"
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found in: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          APK=$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not created"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/artifacts/CarMarket-debug.apk"
          echo "APK successfully copied to artifacts"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMarket-v4-photoreal-cars-APK
          path: artifacts/CarMarket-debug.apk
          if-no-files-found: error
          retention-days: 14
