
name: Build CarMarket APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME" || {
            echo "Android SDK not found"
            exit 1
          }

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract fixed project
        run: |
          test -f CarMarket-Android-Project-Fixed.zip
          mkdir -p source
          unzip -q CarMarket-Android-Project-Fixed.zip -d source
          echo "ZIP extracted"
          find source -maxdepth 4 \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \) -print

      - name: Build APK
        run: |
          GRADLEW=$(find source -type f -name gradlew -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            SETTINGS=$(find source -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "Gradle project not found in ZIP"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
            cd "$PROJECT_DIR"
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMarket-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
